<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HairStyle - Panel Admin</title>
  <link href="/fonts/fonts-local.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow-x: hidden;
    }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      min-height: 100vh;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('/fotos/fondo.jpg') no-repeat center center fixed;
      background-size: cover;
      opacity: 0.3;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      padding: 20px;
      padding-top: env(safe-area-inset-top, 20px);
      max-width: 600px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      padding: 25px 20px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .header h1 { font-family: 'Poppins', sans-serif; font-size: 28px; color: white; }
    .header .user-name { color: #ffd54f; font-weight: 600; }
    .logout-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 20px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid white;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-box { background: white; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .stat-icon { font-size: 24px; margin-bottom: 5px; }
    .stat-number { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 700; color: #e91e63; }
    .stat-label { font-size: 12px; color: #666; }
    .stat-card { background: white; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .stat-card .stat-value { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700; color: white; }
    .stat-card .stat-label { font-size: 11px; color: rgba(255,255,255,0.9); margin-top: 5px; }
    
    .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .card h2 { font-family: 'Poppins', sans-serif; color: #e91e63; font-size: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    
    .menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .menu-item { display: flex; flex-direction: column; align-items: center; padding: 20px 10px; background: linear-gradient(135deg, #e91e63, #9c27b0); color: white; border-radius: 12px; cursor: pointer; transition: transform 0.2s; }
    .menu-item:active { transform: scale(0.95); }
    .menu-item .icon { font-size: 28px; margin-bottom: 8px; }
    .menu-item .label { font-weight: 600; font-size: 13px; text-align: center; }
    .menu-item .desc { font-size: 10px; opacity: 0.8; margin-top: 4px; }
    .menu-item.secondary { background: white; color: #333; border: 2px solid #e91e63; }
    .menu-item.secondary .icon { color: #e91e63; }
    
    .back-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; border: none; border-radius: 20px; cursor: pointer; margin-bottom: 20px; font-size: 14px; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: 600; color: #333; margin-bottom: 5px; font-size: 14px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; font-family: inherit; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #e91e63; }
    
    .btn { display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #e91e63, #9c27b0); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn:active { opacity: 0.9; }
    .btn.secondary { background: white; color: #e91e63; border: 2px solid #e91e63; }
    .btn.small { padding: 8px 16px; font-size: 14px; width: auto; display: inline-block; }
    .btn.danger { background: #f44336; }
    
    .list-item { padding: 15px; background: #f8f8f8; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .list-item .info .name { font-weight: 600; color: #333; }
    .list-item .info .detail { font-size: 12px; color: #666; margin-top: 3px; }
    .list-item .actions { display: flex; gap: 8px; }
    .list-item .actions button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .list-item .actions .edit-btn { background: #2196f3; color: white; }
    .list-item .actions .delete-btn { background: #f44336; color: white; }
    .list-item .actions .view-btn { background: #4caf50; color: white; }
    
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge.pendiente { background: #fff3e0; color: #ff9800; }
    .badge.completado { background: #e8f5e9; color: #4caf50; }
    .badge.cancelado { background: #ffebee; color: #f44336; }
    .badge-notif { background: #e91e63; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; }
    .info-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .info-item .label { color: #666; font-size: 12px; font-weight: 500; }
    .info-item .value { color: #333; font-size: 13px; font-weight: 600; }
    
    .empty-state { text-align: center; padding: 40px 20px; color: #666; }
    .loading { text-align: center; padding: 40px; color: #666; }
    
    .error-page { text-align: center; padding: 60px 20px; background: white; border-radius: 16px; }
    .error-page h2 { color: #e91e63; margin-bottom: 15px; }
    .error-page a { display: inline-block; margin-top: 20px; padding: 12px 30px; background: linear-gradient(135deg, #e91e63, #9c27b0); color: white; border-radius: 25px; text-decoration: none; font-weight: 600; }
    
    .msg { padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px; }
    .msg.success { background: #e8f5e9; color: #4caf50; }
    .msg.error { background: #ffebee; color: #f44336; }
    
    .trat-card { 
      background: #f8f8f8; 
      border-radius: 12px; 
      margin-bottom: 12px; 
      overflow: hidden; 
      cursor: pointer;
    }
    .trat-card:active { opacity: 0.9; }
    .trat-image { 
      width: 100%; 
      height: 120px; 
      object-fit: cover; 
      object-position: center;
      background: #ddd;
    }
    .trat-content { padding: 12px; text-align: center; }
    .trat-content .name { font-weight: 600; color: #333; font-size: 15px; }
    .trat-content .detail { font-size: 12px; color: #666; margin-top: 4px; }
    .trat-content .precio { font-weight: 700; color: #4caf50; margin-top: 8px; font-size: 16px; }
    .trat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    
    .galeria-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .galeria-img { 
      width: 100%; 
      height: 100px; 
      object-fit: cover; 
      border-radius: 8px; 
      cursor: pointer;
    }
    .galeria-img:active { opacity: 0.8; }
    .galeria-categoria { margin-bottom: 20px; }
    .galeria-categoria h3 { color: #e91e63; font-size: 16px; margin-bottom: 10px; }
    
    .turno-detail { 
      background: #f8f8f8; 
      border-radius: 10px; 
      padding: 15px; 
      margin-bottom: 10px; 
    }
    .turno-detail .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .turno-detail .label { color: #666; font-size: 13px; }
    .turno-detail .value { font-weight: 600; color: #333; }
    .turno-actions { display: flex; gap: 8px; margin-top: 10px; }
    .turno-actions button { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .btn-completar { background: #4caf50; color: white; }
    .btn-cancelar { background: #f44336; color: white; }
    .btn-editar { background: #2196f3; color: white; }
    
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-content { background: white; border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-family: 'Poppins', sans-serif; color: #e91e63; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div id="app"></div>
  </div>
  
  <div id="modal-container"></div>

  <script src="/assets/whatsapp-notify.js"></script>
  <script>
    var API = '/api';
    function notificarTurnoAdmin(tipo, datos) {
      if (window.WhatsAppNotify && window.WhatsAppNotify.notificarAdmin) {
        window.WhatsAppNotify.notificarAdmin(tipo, datos);
      }
    }
    var turnosAdminGlobal = [];
    var u = localStorage.getItem('u');
    var t = localStorage.getItem('t');
    
    if (!u || t !== 'admin') {
      document.getElementById('app').innerHTML = 
        '<div class="error-page">' +
          '<h2>Acceso denegado</h2>' +
          '<p>Esta sección es solo para administradores</p>' +
          '<a href="/entrar.html">Ir al login</a>' +
        '</div>';
    } else {
      var user = JSON.parse(u);
      showDashboard();
    }
    
    function logout() {
      localStorage.removeItem('u');
      localStorage.removeItem('t');
      window.location.href = '/entrar.html';
    }
    
    function showDashboard() {
      document.getElementById('app').innerHTML = 
        '<div class="header">' +
          '<h1>HairStyle</h1>' +
          '<p>Bienvenido, <span class="user-name">' + user.nombre + '</span></p>' +
          '<button class="logout-btn" onclick="logout()">Cerrar sesión</button>' +
        '</div>' +
        
        '<div class="stats" id="stats">' +
          '<div class="stat-box"><div class="stat-icon">💰</div><div class="stat-number" id="stat-ingresos">$0</div><div class="stat-label">Ingresos Mes</div></div>' +
          '<div class="stat-box"><div class="stat-icon">👥</div><div class="stat-number" id="stat-clientes">0</div><div class="stat-label">Clientes</div></div>' +
          '<div class="stat-box"><div class="stat-icon">📅</div><div class="stat-number" id="stat-turnos">0</div><div class="stat-label">Turnos Mes</div></div>' +
          '<div class="stat-box"><div class="stat-icon">⏳</div><div class="stat-number" id="stat-pendientes">0</div><div class="stat-label">Pendientes</div></div>' +
        '</div>' +
        
        '<div class="stats" id="stats-grid" style="margin-top:10px;"></div>' +
        
        '<div class="card">' +
          '<h2>📋 Menú Principal</h2>' +
          '<div class="menu">' +
            '<div class="menu-item" onclick="showSection(\'turnos\')"><span class="icon">📅</span><span class="label">Turnos</span><span class="desc" id="menu-turnos-badge">Ver turnos</span></div>' +
            '<div class="menu-item" onclick="showSection(\'nuevo-turno\')"><span class="icon">➕</span><span class="label">Nuevo Turno</span><span class="desc">Crear turno</span></div>' +
            '<div class="menu-item secondary" onclick="showSection(\'registrar-cliente\')"><span class="icon">👤</span><span class="label">Registrar</span><span class="desc">Nuevo cliente</span></div>' +
            '<div class="menu-item secondary" onclick="showSection(\'lista-clientes\')"><span class="icon">📋</span><span class="label">Clientes</span><span class="desc">Ver todos</span></div>' +
            '<div class="menu-item" onclick="showSection(\'tratamientos\')"><span class="icon">💅</span><span class="label">Servicios</span><span class="desc">Tratamientos</span></div>' +
            '<div class="menu-item" onclick="showSection(\'promociones\')"><span class="icon">🎉</span><span class="label">Promociones</span><span class="desc">Ofertas</span></div>' +
            '<div class="menu-item secondary" onclick="showSection(\'galeria\')"><span class="icon">📸</span><span class="label">Galería</span><span class="desc">Fotos</span></div>' +
            '<div class="menu-item secondary" onclick="showSection(\'legajos\')"><span class="icon">📋</span><span class="label">Legajos</span><span class="desc">Anamnesis</span></div>' +
            '<div class="menu-item secondary" onclick="showSection(\'nuevo-legajo\')"><span class="icon">📋</span><span class="label">Nueva Planilla</span><span class="desc">Anamnesis</span></div>' +
            '<div class="menu-item" onclick="showSection(\'ingresos\')"><span class="icon">💰</span><span class="label">Ingresos</span><span class="desc">Detalles</span></div>' +
          '</div>' +
        '</div>';
      
      cargarEstadisticas();
    }
    
    async function cargarEstadisticas() {
      try {
        var [turnosRes, clientesRes, tratamientosRes] = await Promise.all([
          fetch(API + '/turnos'),
          fetch(API + '/clientes'),
          fetch(API + '/tratamientos')
        ]);
        var turnos = await turnosRes.json();
        var clientes = await clientesRes.json();
        var tratamientos = await tratamientosRes.json();
        
        var hoy = new Date();
        var mesActual = hoy.getMonth();
        var anioActual = hoy.getFullYear();
        
        var turnosMes = turnos.filter(function(t) {
          var fechaTurno = new Date(t.fecha);
          return fechaTurno.getMonth() === mesActual && fechaTurno.getFullYear() === anioActual;
        });
        
        var completadosMes = turnosMes.filter(function(t) { return t.estado === 'completado'; });
        var pendientes = turnos.filter(function(t) { return t.estado === 'pendiente'; }).length;
        var completadosTotal = turnos.filter(function(t) { return t.estado === 'completado'; });
        
        var ingresosMes = completadosMes.reduce(function(sum, t) { return sum + parseFloat(t.precio || 0); }, 0);
        var ingresosTotal = completadosTotal.reduce(function(sum, t) { return sum + parseFloat(t.precio || 0); }, 0);
        
        document.getElementById('stat-ingresos').textContent = '$' + ingresosMes.toLocaleString('es-AR');
        document.getElementById('stat-clientes').textContent = clientes.length;
        document.getElementById('stat-turnos').textContent = completadosMes.length;
        document.getElementById('stat-pendientes').textContent = pendientes;
        
        if (pendientes > 0 && document.getElementById('menu-turnos-badge')) {
          document.getElementById('menu-turnos-badge').innerHTML = '<span class="badge-notif">' + pendientes + '</span>';
        }
        
        document.getElementById('stats-grid').innerHTML = 
          '<div class="stat-card" style="background:linear-gradient(135deg,#4caf50,#2e7d32);">' +
            '<div class="stat-value">$' + ingresosTotal.toLocaleString('es-AR') + '</div>' +
            '<div class="stat-label">💰 Ingresos Totales</div>' +
          '</div>' +
          '<div class="stat-card" style="background:linear-gradient(135deg,#2196f3,#1565c0);">' +
            '<div class="stat-value">' + completadosTotal.length + '</div>' +
            '<div class="stat-label">✅ Turnos Completados</div>' +
          '</div>' +
          '<div class="stat-card" style="background:linear-gradient(135deg,#9c27b0,#7b1fa2);">' +
            '<div class="stat-value">' + tratamientos.length + '</div>' +
            '<div class="stat-label">💅 Servicios Activos</div>' +
          '</div>';
      } catch(err) { console.error('Error cargando stats:', err); }
    }
    
    function showSection(section) {
      switch(section) {
        case 'turnos': showTurnos(); break;
        case 'nuevo-turno': showNuevoTurno(); break;
        case 'registrar-cliente': showRegistrarCliente(); break;
        case 'lista-clientes': showListaClientes(); break;
        case 'tratamientos': showTratamientos(); break;
        case 'promociones': showPromociones(); break;
        case 'galeria': showGaleria(); break;
        case 'legajos': showLegajos(); break;
        case 'nuevo-legajo': showNuevaPlanilla(); break;
        case 'ingresos': showIngresos(); break;
        case 'testimonios': showTestimoniosAdmin(); break;
      }
    }
    
    function showBackButton() {
      return '<button class="back-btn" onclick="showDashboard()">← Volver</button>';
    }
    
    // REGISTRAR CLIENTE
    function showRegistrarCliente() {
      document.getElementById('app').innerHTML = 
        showBackButton() +
        '<div class="card">' +
          '<h2>👤 Registrar Nuevo Cliente</h2>' +
          '<div id="msg"></div>' +
          '<form id="registro-form">' +
            '<div class="form-group"><label>Nombre completo *</label><input type="text" id="nombre" required placeholder="Nombre y apellido"></div>' +
            '<div class="form-group"><label>Usuario *</label><input type="text" id="username" required placeholder="Nombre de usuario para login"></div>' +
            '<div class="form-group"><label>Contraseña *</label><input type="password" id="password" required placeholder="Contraseña"></div>' +
            '<div class="form-group"><label>Teléfono</label><input type="tel" id="telefono" placeholder="Ej: 3388673804"></div>' +
            '<div class="form-group"><label>Email</label><input type="email" id="email" placeholder="email@ejemplo.com"></div>' +
            '<button type="submit" class="btn">Registrar Cliente</button>' +
          '</form>' +
        '</div>';
      
      document.getElementById('registro-form').onsubmit = async function(e) {
        e.preventDefault();
        var msg = document.getElementById('msg');
        
        var data = {
          username: document.getElementById('username').value,
          nombre: document.getElementById('nombre').value,
          password: document.getElementById('password').value,
          telefono: document.getElementById('telefono').value || null,
          email: document.getElementById('email').value || null
        };
        
        try {
          var res = await fetch(API + '/auth/registrar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
          });
          var result = await res.json();
          
          if (result.success) {
            msg.innerHTML = '<div class="msg success">¡Cliente registrado exitosamente!</div>';
            setTimeout(function() { showListaClientes(); }, 1500);
          } else {
            msg.innerHTML = '<div class="msg error">' + result.error + '</div>';
          }
        } catch(err) {
          msg.innerHTML = '<div class="msg error">Error de conexión</div>';
        }
      };
    }
    
    // LISTA DE CLIENTES
    function showListaClientes() {
      document.getElementById('app').innerHTML = 
        showBackButton() +
        '<div class="card">' +
          '<h2>📋 Lista de Clientes</h2>' +
          '<div id="clientes-list"><div class="loading">Cargando...</div></div>' +
        '</div>';
      
      loadClientes();
    }
    
    async function loadClientes() {
      try {
        var res = await fetch(API + '/clientes');
        var clientes = await res.json();
        
        if (clientes.length === 0) {
          document.getElementById('clientes-list').innerHTML = '<div class="empty-state">No hay clientes registrados</div>';
        } else {
          var html = '';
          clientes.forEach(function(c) {
            html += '<div class="list-item">' +
              '<div class="info">' +
                '<div class="name">' + (c.nombre || c.username) + '</div>' +
                '<div class="detail">' + (c.telefono || 'Sin teléfono') + ' - ' + (c.email || 'Sin email') + '</div>' +
              '</div>' +
              '<div class="actions">' +
                '<button class="view-btn" onclick="verCliente(' + c.id + ')">Ver</button>' +
                '<button class="edit-btn" onclick="editarCliente(' + c.id + ')">Editar</button>' +
                '<button class="delete-btn" onclick="eliminarCliente(' + c.id + ', \'' + (c.nombre || c.username) + '\')">X</button>' +
              '</div>' +
            '</div>';
          });
          document.getElementById('clientes-list').innerHTML = html;
        }
      } catch(err) {
        document.getElementById('clientes-list').innerHTML = '<div class="empty-state">Error cargando clientes</div>';
      }
    }
    
    // VER CLIENTE
    async function verCliente(id) {
      try {
        var res = await fetch(API + '/cliente/' + id);
        var data = await res.json();
        
        if (data.success) {
          var c = data.cliente;
          var turnos = data.turnos || [];
          
          var turnosHtml = '';
          if (turnos.length > 0) {
            turnos.forEach(function(t) {
              var badgeClass = t.estado === 'pendiente' ? 'pendiente' : (t.estado === 'completado' ? 'completado' : 'cancelado');
              turnosHtml += '<div class="list-item" style="font-size:13px;">' +
                '<div class="info"><div class="name">' + t.fecha + ' ' + t.hora + '</div><div class="detail">' + t.tratamiento + '</div></div>' +
                '<span class="badge ' + badgeClass + '">' + t.estado + '</span>' +
              '</div>';
            });
          } else {
            turnosHtml = '<div class="empty-state" style="padding:20px;">Sin turnos</div>';
          }
          
          document.getElementById('modal-container').innerHTML = 
            '<div class="modal" onclick="closeModal()">' +
              '<div class="modal-content" onclick="event.stopPropagation()">' +
                '<h3>👤 ' + (c.nombre || c.username) + '</h3>' +
                '<div class="form-group"><label>Usuario</label><div style="color:#333;">' + c.username + '</div></div>' +
                '<div class="form-group"><label>Teléfono</label><div style="color:#333;">' + (c.telefono || '-') + '</div></div>' +
                '<div class="form-group"><label>Email</label><div style="color:#333;">' + (c.email || '-') + '</div></div>' +
                '<div class="form-group"><label>Registrado</label><div style="color:#333;">' + (c.created_at ? c.created_at.substring(0,10) : '-') + '</div></div>' +
                '<hr style="margin:15px 0;border:none;border-top:1px solid #eee;">' +
                '<h3 style="font-size:16px;">📅 Turnos</h3>' +
                '<div style="max-height:200px;overflow-y:auto;">' + turnosHtml + '</div>' +
                '<button class="btn secondary" onclick="closeModal()">Cerrar</button>' +
              '</div>' +
            '</div>';
        }

    async function loadTurnos() {

          turnos.forEach(function(t) {

              '<div class="row"><span class="label">Fecha:</span><span class="value">' + t.fecha + ' ' + t.hora + '</span></div>' +
              '<div class="row"><span class="label">Precio:</span><span class="value">$' + (precio > 0 ? precio.toLocaleString('es-AR') : 'Consultar') + '</span></div>' +
              '<div class="row"><span class="label">Estado:</span><span class="badge ' + badgeClass + '">' + (t.estado || 'pendiente') + '</span></div>';
            
            if (t.notas) {
              html += '<div class="row"><span class="label">Notas:</span><span class="value" style="font-size:12px;">' + t.notas + '</span></div>';
            }
            
            if (t.estado === 'pendiente') {
              html += '<div class="turno-actions">' +
                '<button class="btn-completar" onclick="completarTurno(' + t.id + ')">✅ Completar</button>' +
                '<button class="btn-cancelar" onclick="cancelarTurno(' + t.id + ')">❌ Cancelar</button>' +

    async function loadTratamientos() {
      try {
        var res = await fetch(API + '/tratamientos');

        if (tratamientos.length === 0 || tratamientos.length > 5) {

      }

    // INICIALIZAR TRATAMIENTOS (crear/actualizar los tratamientos base con imagen)
    async function inicializarTratamientos(confirmar) {
      if (confirmar && !confirm('¿Crear/actualizar tratamientos con las categorías correctas?')) return;
      
      // Primero eliminar TODOS los tratamientos (borrado real)
      try {
        var res = await fetch(API + '/tratamientos');
        var existing = await res.json();
        
        // Eliminar uno por uno esperando entre cada uno
        for (var i = 0; i < existing.length; i++) {
          await fetch(API + '/tratamientos/' + existing[i].id, { 
            method: 'DELETE',
            headers: {'Content-Type': 'application/json'}
          });
          // Pequeña pausa entre cada eliminación
          await new Promise(function(r) { setTimeout(r, 100); });
        }
      } catch(e) { 
        console.log('Error eliminando:', e); 
      }
      
      // Pequeña pausa antes de crear nuevos
      await new Promise(function(r) { setTimeout(r, 200); });
      
      // Crear tratamientos con las imágenes correctas
      var tratamientos = [
        { nombre: 'LIFTING DE PESTAÑAS', precio: 18000, duracion: 90, descripcion: 'Lifting profesional de pestañas', imagen_url: '/fotos/liftingpestanas.jpg' },
        { nombre: 'DISEÑO Y PERFILADO DE CEJAS', precio: 12000, duracion: 45, descripcion: 'Diseño personalizado de cejas', imagen_url: '/fotos/perfilaydisenocejas.jpg' },
        { nombre: 'TRATAMIENTOS Y ALISADOS', precio: 0, duracion: 180, descripcion: 'Baños de crema y alisados', imagen_url: '/fotos/tratamientosyalisados.jpg' },
        { nombre: 'PEINADOS', precio: 0, duracion: 60, descripcion: 'Peinados para eventos', imagen_url: '/fotos/peinado.jpg' },
        { nombre: 'LIMPIEZA FACIAL', precio: 25000, duracion: 75, descripcion: 'Limpieza facial profunda', imagen_url: '/fotos/facial.jpg' }
      ];
      
      for (var j = 0; j < tratamientos.length; j++) {
        var t = tratamientos[j];
        try {
          await fetch(API + '/tratamientos', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(t)
          });
          // Pausa entre cada creación
          await new Promise(function(r) { setTimeout(r, 100); });
        } catch(e) { 
          console.log('Error creando:', e); 
        }
      }
      
      if (confirmar) alert('¡Servicios actualizados!');
      loadTratamientos();
    }

    // INGRESOS
    async function showIngresos() {
      var meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
      var anioActual = new Date().getFullYear();
      var mesActual = new Date().getMonth();
      
      var anios = [];
      for (var a = 2023; a <= anioActual; a++) anios.push(a);
      
      document.getElementById('app').innerHTML = 
        showBackButton() +
        '<div class="header"><h1>💰 Mis Ingresos</h1></div>' +
        '<div style="background:#333;padding:15px;border-radius:16px;margin-bottom:15px;">' +
          '<div style="display:flex;gap:10px;justify-content:center;">' +
            '<select id="ing-mes" onchange="cargarIngresos(parseInt(this.value), parseInt(document.getElementById(\'ing-anio\').value))" style="padding:10px;border-radius:8px;border:none;width:120px;">' +
              meses.map(function(m,i){return '<option value="'+i+'"'+(i===mesActual?' selected':'')+'>'+m+'</option>';}).join('') +
            '</select>' +
            '<select id="ing-anio" onchange="cargarIngresos(parseInt(document.getElementById(\'ing-mes\').value), parseInt(this.value))" style="padding:10px;border-radius:8px;border:none;width:80px;">' +
              anios.map(function(a){return '<option value="'+a+'"'+(a===anioActual?' selected':'')+'>'+a+'</option>';}).join('') +
            '</select>' +
          '</div>' +
        '</div>' +
        '<div id="ingresos-content" style="background:#333;border-radius:16px;padding:15px;color:white;"></div>';
      
      cargarIngresos(mesActual, anioActual);
    }
    
    async function cargarIngresos(mes, anio) {
      try {
        var res = await fetch(API + '/turnos');
        var turnos = await res.json();
        
        function getMonth(f) { if (!f || f.length < 5) return 0; return parseInt(f.split('-')[1]) - 1; }
        function getAnio(f) { if (!f || f.length < 4) return 2024; return parseInt(f.split('-')[0]); }
        
        var delMes = turnos.filter(function(t) { return getMonth(t.fecha) === mes && getAnio(t.fecha) === anio && t.estado !== 'cancelado'; });
        var total = delMes.reduce(function(s, t) { return s + parseFloat(t.precio || 0); }, 0);
        
        var html = '<div style="background:linear-gradient(135deg,#e91e63,#9c27b0);padding:25px;border-radius:16px;text-align:center;color:white;margin-bottom:15px;">' +
          '<div style="font-size:16px;opacity:0.9;">💰 Ingresos de ' + meses[mes] + ' ' + anio + '</div>' +
          '<div style="font-size:36px;font-weight:700;">$' + total.toLocaleString('es-AR') + '</div></div>';
        
        html += '<button onclick="mostrarIngresoExtra()" style="width:100%;padding:12px;background:#4caf50;color:white;border:none;border-radius:8px;font-weight:600;margin-bottom:15px;">+ Agregar Ingreso Extra</button>';
        
        if (delMes.length > 0) {
          html += '<h3 style="color:white;margin:15px 0 10px;font-size:14px;">📅 Turnos del Mes</h3>';
          html += '<input type="text" id="buscar-turno" placeholder="Buscar por cliente o fecha (ej: 15/04)..." onkeyup="filtrarIngresos()" style="width:93%;padding:10px;border-radius:8px;border:1px solid #555;background:#222;color:white;margin-bottom:10px;font-size:12px;">';
          html += '<div>';
          delMes.sort(function(a, b) { return b.fecha.localeCompare(a.fecha); }).forEach(function(t) {
            var precio = parseFloat(t.precio || 0);
            var estadoColor = t.estado === 'completado' ? '#4caf50' : '#ff9800';
            html += '<div class="turno-item" data-cli="'+(t.cliente_nombre || '')+'" data-fecha="'+t.fecha+'" style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #444;font-size:12px;color:white;">' +
              '<div>' + t.fecha + ' - ' + (t.tratamiento_nombre || 'Servicio') + '<br><small style="color:#888;">' + (t.cliente_nombre || '') + ' ('+(t.estado || 'pendiente')+')</small></div>' +
              '<div style="font-weight:600;color:'+estadoColor+';">' + (precio > 0 ? '$' + precio.toLocaleString('es-AR') : '---') + '</div></div>';
          });
          html += '</div>';
        }
        
        document.getElementById('ingresos-content').innerHTML = html;
      } catch(err) {
        document.getElementById('ingresos-content').innerHTML = '<div class="empty-state">Error cargando</div>';
      }
    }
    
    function filtrarIngresos() {
      var busq = document.getElementById('buscar-turno').value.toLowerCase();
      document.querySelectorAll('.turno-item').forEach(function(item) {
        var cli = (item.getAttribute('data-cli') || '').toLowerCase();
        var fecha = (item.getAttribute('data-fecha') || '').toLowerCase();
        var matches = cli.indexOf(busq) >= 0 || fecha.indexOf(busq) >= 0 || busq === '';
        item.style.display = matches ? 'flex' : 'none';
      });
    }
    
    function mostrarIngresoExtra() {
      document.getElementById('modal-container').innerHTML = 
        '<div class="modal" onclick="if(event.target===this)closeModal()">' +
          '<div class="modal-content" onclick="event.stopPropagation()">' +
            '<h3>💰 Agregar Ingreso Extra</h3>' +
            '<form id="form-ie">' +
              '<div class="form-group"><label>Concepto</label><input type="text" id="ie-concepto" required></div>' +
              '<div class="form-group"><label>Monto</label><input type="number" id="ie-monto" required></div>' +
              '<div class="form-group"><label>Fecha</label><input type="date" id="ie-fecha"></div>' +
              '<button type="submit" class="btn">Guardar</button>' +
              '<button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>' +
            '</form>' +
          '</div></div>';
      document.getElementById('ie-fecha').value = new Date().toISOString().split('T')[0];
      document.getElementById('form-ie').onsubmit = function(e) {
        e.preventDefault();
        var extras = JSON.parse(localStorage.getItem('ingresos_extras') || '[]');
        extras.push({
          concepto: document.getElementById('ie-concepto').value,
          monto: parseInt(document.getElementById('ie-monto').value),
          fecha: document.getElementById('ie-fecha').value
        });
        localStorage.setItem('ingresos_extras', JSON.stringify(extras));
        closeModal();
        document.getElementById('ingresos-content').innerHTML = '<div class="msg success">Ingreso extra guardado</div>';
        setTimeout(function() { showIngresos(); }, 1000);
      };
    }

    function showTestimoniosAdmin() {
      document.getElementById('app').innerHTML =

    async function loadTestimoniosAdmin() {
      try {
        var res = await fetch(API + '/testimonios/todos');
        var testimonios = await res.json();
        
        var container = document.getElementById('testimonios-admin-list');
        
        if (testimonios.length === 0) {
          container.innerHTML = '<div class="empty-state">No hay reseñas aún</div>';
        } else {
          var html = '';
          testimonios.forEach(function(t) {
            var estrellas = '⭐'.repeat(t.calificacion || 5);
            var estadoBadge = t.aprobado ? 
              '<span class="badge completado">Aprobado</span>' : 
              '<span class="badge pendiente">Pendiente</span>';
            
            html += '<div class="list-item" style="flex-direction:column;align-items:flex-start;">' +
              '<div style="width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
                '<span style="font-weight:600;">' + (t.cliente_nombre || 'Cliente') + '</span>' +
                estadoBadge +
              '</div>' +
              '<div style="color:#666;font-size:13px;margin-bottom:5px;">' + estrellas + '</div>' +
              '<div style="color:#444;font-size:14px;">"' + t.texto + '"</div>' +
              '<div style="display:flex;gap:8px;margin-top:10px;">';
            
            if (!t.aprobado) {
              html += '<button class="btn small" style="background:#4caf50;color:white;" onclick="aprobarTestimonio(' + t.id + ', true)">✅ Aprobar</button>';
            } else {
              html += '<button class="btn small" style="background:#ff9800;color:white;" onclick="aprobarTestimonio(' + t.id + ', false)">❌ Desaprobar</button>';
            }
            html += '<button class="btn small danger" onclick="eliminarTestimonio(' + t.id + ')">🗑️ Eliminar</button>' +
              '</div>' +
            '</div>';
          });
          container.innerHTML = html;
        }
      } catch(err) {
        document.getElementById('testimonios-admin-list').innerHTML = '<div class="empty-state">Error cargando reseñas</div>';
      }
    }
    
    async function aprobarTestimonio(id, aprobado) {
      try {
        var res = await fetch(API + '/testimonios/' + id + '/aprobar', {
          method: 'PATCH',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({aprobado: aprobado})
        });
        var result = await res.json();
        if (result.success) {
          loadTestimoniosAdmin();
        }
      } catch(err) {
        alert('Error');
      }
    }
    
    async function eliminarTestimonio(id) {
      if (!confirm('¿Eliminar esta reseña?')) return;
      try {
        var res = await fetch(API + '/testimonios/' + id, { method: 'DELETE' });
        var result = await res.json();
        if (result.success) {
          loadTestimoniosAdmin();
        }
      } catch(err) {
        alert('Error');
      }
    }
